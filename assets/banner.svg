<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" role="img" aria-label="One Piece themed banner — straw hat, pirate ship and sea">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E9BD6"/>
      <stop offset="0.55" stop-color="#8FD0EC"/>
      <stop offset="1" stop-color="#F7C948"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B6FA8"/>
      <stop offset="1" stop-color="#083B5C"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#FFD96B" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFD96B" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="1600" height="300" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="1300" cy="100" r="120" fill="url(#sunGlow)"/>
  <circle cx="1300" cy="100" r="52" fill="#FFD96B"/>
  <g stroke="#FFE9A8" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="1300" y1="18" x2="1300" y2="34"/>
    <line x1="1300" y1="166" x2="1300" y2="182"/>
    <line x1="1218" y1="100" x2="1234" y2="100"/>
    <line x1="1366" y1="100" x2="1382" y2="100"/>
    <line x1="1242" y1="42" x2="1253" y2="53"/>
    <line x1="1347" y1="147" x2="1358" y2="158"/>
    <line x1="1358" y1="42" x2="1347" y2="53"/>
    <line x1="1253" y1="147" x2="1242" y2="158"/>
  </g>

  <!-- drifting clouds -->
  <g fill="#FFFFFF" opacity="0.92">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-400 0; 2000 0" dur="90s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="150" rx="120" ry="34"/>
      <ellipse cx="70" cy="132" rx="80" ry="28"/>
      <ellipse cx="-80" cy="140" rx="70" ry="26"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="-200 0; 1800 0" dur="70s" begin="15s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="60" rx="150" ry="36"/>
      <ellipse cx="80" cy="42" rx="90" ry="28"/>
      <ellipse cx="-90" cy="52" rx="80" ry="26"/>
    </g>
    <g opacity="0.75">
      <animateTransform attributeName="transform" type="translate" values="-300 0; 1900 0" dur="110s" begin="40s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="220" rx="130" ry="30"/>
      <ellipse cx="60" cy="206" rx="70" ry="22"/>
    </g>
  </g>

  <!-- seagulls -->
  <g stroke="#3A5A6E" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M300 120 Q308 112 316 120 Q324 112 332 120"/>
    <path d="M345 132 Q352 125 359 132 Q366 125 373 132"/>
    <path d="M430 108 Q437 101 444 108 Q451 101 458 108"/>
  </g>

  <!-- title -->
  <g filter="url(#glow)">
    <text x="800" y="92" text-anchor="middle" font-family="'Courier New', monospace" font-size="62" font-weight="bold" letter-spacing="10" fill="#FFD96B" stroke="#083B5C" stroke-width="2">
      sai-pa416
      <animate attributeName="opacity" values="1;0.65;1" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="800" y="132" text-anchor="middle" font-family="'Courier New', monospace" font-size="26" font-weight="bold" letter-spacing="14" fill="#FFFFFF" stroke="#0B6FA8" stroke-width="1.5">
      ONE PIECE DEVELOPER
    </text>
    <text x="800" y="158" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" letter-spacing="6" fill="#E63946" stroke="#083B5C" stroke-width="1">
      &gt; I'm gonna be the King of the Developers!
      <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Jolly Roger (skull + crossbones) -->
  <g transform="translate(150 130) scale(1.1)">
    <rect x="-34" y="0" width="72" height="10" fill="#F2EFE6" transform="rotate(45 2 5)"/>
    <rect x="-34" y="0" width="72" height="10" fill="#F2EFE6" transform="rotate(-45 2 5)"/>
    <circle cx="2" cy="-18" r="24" fill="#F2EFE6"/>
    <path d="M2 2 Q2 16 -8 28 L12 28 Q2 14 2 2 Z" fill="#F2EFE6"/>
    <circle cx="-8" cy="-16" r="6" fill="#083B5C"/>
    <circle cx="12" cy="-16" r="6" fill="#083B5C"/>
    <path d="M-4 -4 L2 -8 L8 -4 Z" fill="#083B5C"/>
  </g>

  <!-- STRAW HAT emblem -->
  <g transform="translate(800 252)">
    <!-- brim -->
    <ellipse cx="0" cy="16" rx="188" ry="30" fill="#E8C87A" stroke="#B0893F" stroke-width="4"/>
    <!-- brim ribbed lines -->
    <g stroke="#C9A45C" stroke-width="3" opacity="0.7">
      <line x1="-150" y1="8" x2="-150" y2="24"/>
      <line x1="-110" y1="2" x2="-112" y2="26"/>
      <line x1="-70" y1="-4" x2="-74" y2="28"/>
      <line x1="-30" y1="-8" x2="-36" y2="30"/>
      <line x1="10" y1="-10" x2="8" y2="30"/>
      <line x1="50" y1="-8" x2="52" y2="28"/>
      <line x1="90" y1="-4" x2="94" y2="26"/>
      <line x1="130" y1="2" x2="134" y2="24"/>
      <line x1="170" y1="8" x2="170" y2="20"/>
    </g>
    <!-- dome -->
    <path d="M-150 16 A150 120 0 0 1 150 16 L150 16 L-150 16 Z" fill="#E8C87A" stroke="#B0893F" stroke-width="4"/>
    <!-- dome weave lines -->
    <g stroke="#C9A45C" stroke-width="2.5" fill="none" opacity="0.55">
      <path d="M-120 16 Q0 -40 120 16"/>
      <path d="M-96 16 Q0 -74 96 16"/>
      <path d="M-56 16 Q0 -104 56 16"/>
    </g>
    <!-- red band -->
    <path d="M-120 2 Q0 -44 120 2 Q118 10 0 -20 Q-118 10 -120 2 Z" fill="#E63946"/>
    <path d="M-140 12 A150 120 0 0 1 140 12 L120 6 Q0 -34 -120 6 Z" fill="#E63946"/>
    <!-- band highlight -->
    <path d="M-130 8 Q0 -38 130 8" stroke="#FF6B79" stroke-width="3" fill="none" opacity="0.7"/>
    <!-- dome highlight -->
    <path d="M-70 -30 Q0 -90 70 -30" stroke="#F6DFA8" stroke-width="5" fill="none" opacity="0.8" stroke-linecap="round"/>
    <!-- shine -->
    <path d="M-90 16 Q-30 -70 40 -80" stroke="#FFF7DC" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- sea -->
  <rect x="0" y="300" width="1600" height="100" fill="url(#sea)"/>
  <rect x="0" y="300" width="1600" height="4" fill="#C9E8F5"/>

  <!-- animated waves -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#5FB6DD" stroke-width="7" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0 0; -90 0; 0 0" dur="7s" repeatCount="indefinite"/>
      <path d="M0 320 Q40 311 80 320 T160 320 T240 320 T320 320 T400 320 T480 320 T560 320 T640 320 T720 320 T800 320 T880 320 T960 320 T1040 320 T1120 320 T1200 320 T1280 320 T1360 320 T1440 320 T1520 320 T1600 320"/>
    </g>
    <g stroke="#9BD6EE" stroke-width="5" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0 0; 110 0; 0 0" dur="8.5s" begin="1s" repeatCount="indefinite"/>
      <path d="M0 340 Q40 331 80 340 T160 340 T240 340 T320 340 T400 340 T480 340 T560 340 T640 340 T720 340 T800 340 T880 340 T960 340 T1040 340 T1120 340 T1200 340 T1280 340 T1360 340 T1440 340 T1520 340 T1600 340"/>
    </g>
    <g stroke="#EAF7FF" stroke-width="4" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0; -70 0; 0 0" dur="6s" begin="0.5s" repeatCount="indefinite"/>
      <path d="M0 360 Q40 351 80 360 T160 360 T240 360 T320 360 T400 360 T480 360 T560 360 T640 360 T720 360 T800 360 T880 360 T960 360 T1040 360 T1120 360 T1200 360 T1280 360 T1360 360 T1440 360 T1520 360 T1600 360"/>
    </g>
  </g>

  <!-- PIRATE SHIP -->
  <g>
    <!-- mast -->
    <rect x="1234" y="228" width="12" height="104" fill="#6B3F21"/>
    <!-- main sail -->
    <path d="M1246 234 Q1320 244 1340 292 Q1308 316 1246 320 Z" fill="#F5EBD8" stroke="#B0846A" stroke-width="4" stroke-linejoin="round"/>
    <!-- front sail -->
    <path d="M1234 250 Q1194 258 1180 284 Q1200 306 1234 312 Z" fill="#EEDCC0" stroke="#B0846A" stroke-width="4" stroke-linejoin="round"/>
    <!-- skull flag -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 1234 232; 4 1234 232; -4 1234 232" dur="1.6s" repeatCount="indefinite"/>
      <path d="M1236 224 L1286 220 L1280 244 L1236 240 Z" fill="#101018"/>
      <circle cx="1258" cy="232" r="4" fill="#F2EFE6"/>
      <circle cx="1255.5" cy="231.5" r="1.3" fill="#101018"/>
      <circle cx="1260.5" cy="231.5" r="1.3" fill="#101018"/>
      <rect x="1254" y="235" width="8" height="2" fill="#F2EFE6"/>
    </g>
    <!-- hull -->
    <path d="M1138 318 Q1250 303 1358 318 L1338 346 Q1250 356 1162 346 Z" fill="#7B4B2A" stroke="#5A3420" stroke-width="4" stroke-linejoin="round"/>
    <rect x="1138" y="310" width="220" height="8" rx="3" fill="#8A5A33"/>
    <!-- canon -->
    <rect x="1280" y="330" width="26" height="10" rx="3" fill="#3A2415"/>
    <!-- railing -->
    <line x1="1146" y1="312" x2="1352" y2="312" stroke="#8A5A33" stroke-width="3"/>
  </g>

  <!-- compass rose -->
  <g transform="translate(1450 340)">
    <path d="M0 -22 L6 -4 L22 0 L6 4 L0 22 L-6 4 L-22 0 L-6 -4 Z" fill="#F7C948" stroke="#083B5C" stroke-width="2"/>
    <path d="M0 -22 L0 22 M-22 0 L22 0" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
    <circle cx="0" cy="0" r="3" fill="#083B5C"/>
  </g>

  <!-- treasure sparkles -->
  <g fill="#FFE9A8">
    <path d="M420 180 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 Z">
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.6s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M990 170 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 Z">
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M600 250 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 Z">
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="3s" begin="0.7s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>