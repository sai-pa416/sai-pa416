<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Animated Minecraft banner for sai-pa416">
  <defs>
    <linearGradient id="cave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b0b"/>
      <stop offset="1" stop-color="#1f1f1f"/>
    </linearGradient>
  </defs>

  <!-- cave background -->
  <rect width="1200" height="300" fill="url(#cave)"/>

  <!-- floating particles (gold / emerald / diamond) -->
  <g>
    <rect x="140" y="150" width="10" height="10" fill="#ffd83b" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="5s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -70" dur="5s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="230" y="90" width="8" height="8" fill="#5fbf3e" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="6s" begin="1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -70" dur="6s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="330" y="200" width="10" height="10" fill="#4ae3f5" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="4.5s" begin="0.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -70" dur="4.5s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="70" y="60" width="8" height="8" fill="#ffd83b" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="5.5s" begin="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -70" dur="5.5s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="420" y="120" width="10" height="10" fill="#b03ad6" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="6.5s" begin="1.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -70" dur="6.5s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="760" y="70" width="8" height="8" fill="#ffd83b" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="5s" begin="0.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -70" dur="5s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="860" y="160" width="10" height="10" fill="#5fbf3e" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="4.8s" begin="2.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -70" dur="4.8s" begin="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="1090" y="110" width="8" height="8" fill="#4ae3f5" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="6s" begin="1.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -70" dur="6s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="1040" y="220" width="10" height="10" fill="#ffd83b" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="5.2s" begin="0.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -70" dur="5.2s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- pixel word "SAI" assembling block by block, gently bobbing -->
  <g fill="#5fbf3e">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="3.5s" repeatCount="indefinite"/>
    <!-- S -->
    <rect x="511" y="95" width="50" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.15s" fill="freeze"/></rect>
    <rect x="511" y="105" width="10" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.3s" fill="freeze"/></rect>
    <rect x="511" y="115" width="10" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.45s" fill="freeze"/></rect>
    <rect x="511" y="125" width="50" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.6s" fill="freeze"/></rect>
    <rect x="551" y="135" width="10" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.75s" fill="freeze"/></rect>
    <rect x="551" y="145" width="10" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.9s" fill="freeze"/></rect>
    <rect x="511" y="155" width="50" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.05s" fill="freeze"/></rect>
    <!-- A -->
    <rect x="585" y="95" width="30" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.25s" fill="freeze"/></rect>
    <rect x="575" y="105" width="10" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.4s" fill="freeze"/></rect>
    <rect x="615" y="105" width="10" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.4s" fill="freeze"/></rect>
    <rect x="575" y="115" width="10" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.55s" fill="freeze"/></rect>
    <rect x="615" y="115" width="10" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.55s" fill="freeze"/></rect>
    <rect x="575" y="125" width="50" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.7s" fill="freeze"/></rect>
    <rect x="575" y="135" width="10" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.85s" fill="freeze"/></rect>
    <rect x="615" y="135" width="10" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.85s" fill="freeze"/></rect>
    <rect x="575" y="145" width="10" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1s" fill="freeze"/></rect>
    <rect x="615" y="145" width="10" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1s" fill="freeze"/></rect>
    <rect x="575" y="155" width="10" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.15s" fill="freeze"/></rect>
    <rect x="615" y="155" width="10" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.15s" fill="freeze"/></rect>
    <!-- I -->
    <rect x="639" y="95" width="50" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.35s" fill="freeze"/></rect>
    <rect x="649" y="105" width="10" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.5s" fill="freeze"/></rect>
    <rect x="649" y="115" width="10" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.65s" fill="freeze"/></rect>
    <rect x="649" y="125" width="10" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/></rect>
    <rect x="649" y="135" width="10" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.95s" fill="freeze"/></rect>
    <rect x="649" y="145" width="10" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/></rect>
    <rect x="639" y="155" width="50" height="10"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.25s" fill="freeze"/></rect>
  </g>

  <!-- subtitle -->
  <text x="600" y="215" text-anchor="middle" font-family="'Courier New', monospace" font-size="24" font-weight="bold" letter-spacing="8" fill="#ffd83b" opacity="1">
    MINECRAFT DEVELOPER
    <animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- creeper face with blinking eyes -->
  <g>
    <rect x="950" y="70" width="96" height="12" fill="#5fbf3e"/>
    <rect x="950" y="82" width="24" height="12" fill="#5fbf3e"/>
    <rect x="950" y="94" width="24" height="12" fill="#5fbf3e"/>
    <g>
      <animate attributeName="opacity" values="1;1;0.1;1" dur="5s" begin="3s" repeatCount="indefinite"/>
      <rect x="974" y="82" width="48" height="12" fill="#0b0b0b"/>
      <rect x="974" y="94" width="48" height="12" fill="#0b0b0b"/>
      <rect x="974" y="106" width="48" height="12" fill="#0b0b0b"/>
    </g>
    <rect x="1022" y="82" width="24" height="12" fill="#5fbf3e"/>
    <rect x="1022" y="94" width="24" height="12" fill="#5fbf3e"/>
    <rect x="950" y="106" width="12" height="12" fill="#5fbf3e"/>
    <rect x="962" y="106" width="12" height="12" fill="#0b0b0b"/>
    <rect x="974" y="106" width="12" height="12" fill="#5fbf3e"/>
    <rect x="986" y="106" width="12" height="12" fill="#0b0b0b"/>
    <rect x="998" y="106" width="12" height="12" fill="#0b0b0b"/>
    <rect x="1010" y="106" width="12" height="12" fill="#5fbf3e"/>
    <rect x="1022" y="106" width="12" height="12" fill="#0b0b0b"/>
    <rect x="1034" y="106" width="12" height="12" fill="#5fbf3e"/>
    <rect x="950" y="118" width="12" height="12" fill="#5fbf3e"/>
    <rect x="962" y="118" width="12" height="12" fill="#0b0b0b"/>
    <rect x="974" y="118" width="12" height="12" fill="#5fbf3e"/>
    <rect x="986" y="118" width="12" height="12" fill="#0b0b0b"/>
    <rect x="998" y="118" width="12" height="12" fill="#0b0b0b"/>
    <rect x="1010" y="118" width="12" height="12" fill="#5fbf3e"/>
    <rect x="1022" y="118" width="12" height="12" fill="#0b0b0b"/>
    <rect x="1034" y="118" width="12" height="12" fill="#5fbf3e"/>
    <rect x="950" y="130" width="12" height="12" fill="#5fbf3e"/>
    <rect x="962" y="130" width="12" height="12" fill="#0b0b0b"/>
    <rect x="974" y="130" width="48" height="12" fill="#5fbf3e"/>
    <rect x="1022" y="130" width="12" height="12" fill="#0b0b0b"/>
    <rect x="1034" y="130" width="12" height="12" fill="#5fbf3e"/>
  </g>

  <!-- grass + dirt strip -->
  <rect x="0" y="268" width="1200" height="14" fill="#55aa33"/>
  <rect x="0" y="282" width="1200" height="18" fill="#8b5a2b"/>

  <text x="14" y="294" font-family="'Courier New', monospace" font-size="13" fill="#6b6b6b">v1.2 — survival mode</text>
</svg>