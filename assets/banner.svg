<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" role="img" aria-label="Cyberpunk anime banner — developer coding at night">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="1" stop-color="#141A26"/>
    </linearGradient>
    <radialGradient id="cityGlow" cx="0.72" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="monGlow">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="1600" height="400" fill="url(#sky)"/>
  <rect width="1600" height="400" fill="url(#cityGlow)"/>

  <!-- moon -->
  <circle cx="1330" cy="92" r="110" fill="url(#moonGlow)"/>
  <circle cx="1330" cy="92" r="48" fill="#E9EDFF" opacity="0.9"/>
  <circle cx="1316" cy="82" r="9" fill="#C6D0F5" opacity="0.7"/>
