<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Glowing anime avatar of sai-pa416">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#161B22"/>
      <stop offset="1" stop-color="#0B0E14"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A371F7"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="coreGlow">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- outer glow -->
  <circle cx="120" cy="120" r="116" fill="url(#coreGlow)"/>
  <circle cx="120" cy="120" r="112" fill="url(#bg)" stroke="#1F2631" stroke-width="1.5"/>

  <!-- rotating dashed neon ring -->
  <g transform="rotate(0 120 120)">
    <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="14s" repeatCount="indefinite"/>
    <circle cx="120" cy="120" r="104" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="34 22" filter="url(#glow)"/>
  </g>
  <g transform="rotate(0 120 120)">
    <animateTransform attributeName="transform" type="rotate" from="360 120 120" to="0 120 120" dur="10s" repeatCount="indefinite"/>
    <circle cx="120" cy="120" r="96" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 14" opacity="0.7"/>
  </g>

  <!-- hair / head silhouette -->
  <g>
    <path d="M64 112 Q64 58 120 58 Q176 58 176 112 Q176 122 170 128 L70 128 Q64 122 64 112 Z" fill="#241F33"/>
    <path d="M78 84 Q120 52 168 86" stroke="#A371F7" stroke-width="3" fill="none" opacity="0.85"/>
    <path d="M70 108 Q76 72 118 70" stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.6"/>
  </g>
  <!-- face -->
  <ellipse cx="120" cy="126" rx="46" ry="52" fill="#F6C9AB"/>
  <!-- blush -->
  <ellipse cx="88" cy="142" rx="9" ry="5" fill="#F472B6" opacity="0.35"/>
  <ellipse cx="152" cy="142" rx="9" ry="5" fill="#F472B6" opacity="0.35"/>
  <!-- eyes -->
  <g filter="url(#glow)">
    <ellipse cx="97" cy="120" rx="10" ry="14" fill="#8B5CF6"/>
    <ellipse cx="143" cy="120" rx="10" ry="14" fill="#8B5CF6"/>
  </g>
  <ellipse cx="95" cy="114" rx="3.5" ry="4" fill="#FFFFFF" opacity="0.95"/>
  <ellipse cx="141" cy="114" rx="3.5" ry="4" fill="#FFFFFF" opacity="0.95"/>
  <!-- mouth -->
  <path d="M112 148 Q120 156 128 148" stroke="#E87D5A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- bangs over eyes hint -->
  <path d="M82 108 Q120 96 158 108 Q158 120 120 112 Q82 120 82 108 Z" fill="#241F33"/>
  <!-- neck + jacket -->
  <rect x="108" y="172" width="24" height="20" rx="7" fill="#E8B79B"/>
  <path d="M78 196 Q86 178 120 178 Q154 178 162 196 L166 222 L74 222 Z" fill="#151B27"/>
  <path d="M86 200 Q120 186 154 200" stroke="#38BDF8" stroke-width="3" fill="none" opacity="0.85"/>
  <path d="M74 222 Q120 214 166 222" stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.7"/>
  <!-- jacket zipper light -->
  <rect x="118" y="184" width="4" height="26" rx="2" fill="#8B5CF6" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- sparkles -->
  <g fill="#38BDF8">
    <path d="M56 96 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 Z" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
    </path>
    <path d="M186 84 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 Z" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.2s" begin="1.2s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#F472B6">
    <path d="M190 150 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 Z" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="3s" begin="0.8s" repeatCount="indefinite"/>
    </path>
    <path d="M48 150 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 Z" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>